name: Vương Quốc C1 quality

on:
  push:
    paths: ['apps/vuongquoc-c1/**', '.github/workflows/vuongquoc-c1.yml']
  pull_request:
    paths: ['apps/vuongquoc-c1/**', '.github/workflows/vuongquoc-c1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/vuongquoc-c1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/vuongquoc-c1/.nvmrc
          cache: npm
          cache-dependency-path: apps/vuongquoc-c1/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
